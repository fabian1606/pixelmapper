# Pixelmapper desktop app (ADR 0003): Tauri 2 shell around the Nuxt SPA.
# Native capabilities are exposed as commands and consumed by
# `app/platform/tauri` on the frontend.
[package]
name = "pixelmapper-desktop"
version = "0.1.0"
description = "Pixelmapper desktop app"
edition = "2021"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "pixelmapper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
# Built-in Art-Net 4 / RDM bridge (`src/artnet.rs`): the bridge core of `pmnet-bridge serve`, without its
# WebSocket server (pixelmapper-hardware repo, AGPL-3.0).
pmnet-bridge = { git = "https://github.com/fabian1606/pixelmapper-hardware", rev = "8bb49ddc9b2c579463dd37a79a1ed45bcf75ac57", default-features = false }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
# Node simulator (`pmnet sim`) for the built-in bridge's test against the real backend; same rev as pmnet-bridge.
pixelmapper-net = { git = "https://github.com/fabian1606/pixelmapper-hardware", rev = "8bb49ddc9b2c579463dd37a79a1ed45bcf75ac57" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
