[env:esp32s3_neopixel]
platform = https://github.com/pioarduino/platform-espressif32.git#a9fac07
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -I${PROJECT_DIR}/../rs-engine/ffi/include
    -DCORE_DEBUG_LEVEL=2
    -DMAX_LEDS_HARD_CAP=2048
    -DMDNS_HOSTNAME_PREFIX=\"pixelmapper-strip\"

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2
    fastled/FastLED @ ^3.7

extra_scripts = pre:link_rust.py
