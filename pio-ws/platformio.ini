[env:esp32s3_neopixel]
platform = https://github.com/pioarduino/platform-espressif32.git#a9fac07
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -I${PROJECT_DIR}/../rs-engine/ffi/include
    -DCORE_DEBUG_LEVEL=2
    -DMAX_LEDS_HARD_CAP=2048
    -DMDNS_HOSTNAME_PREFIX=\"pixelmapper-strip\"
    ; Route `Serial` to the native USB-Serial-JTAG (USB-CDC) instead of UART0.
    ; The Waveshare ESP32-S3-ETH (and most S3 boards) have no external
    ; USB-UART bridge — Serial must go through the chip's own USB peripheral.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2
    fastled/FastLED @ ^3.7

extra_scripts = pre:link_rust.py

[env:esp32s3_eth_neopixel]
platform = https://github.com/pioarduino/platform-espressif32.git#a9fac07
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -I${PROJECT_DIR}/../rs-engine/ffi/include
    -DCORE_DEBUG_LEVEL=2
    -DMAX_LEDS_HARD_CAP=2048
    -DMDNS_HOSTNAME_PREFIX=\"pixelmapper-strip\"
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_ETHERNET=1
    ; Waveshare ESP32-S3-ETH W5500 SPI pins
    -DETH_MOSI=11 -DETH_MISO=12 -DETH_SCK=13
    -DETH_CS=14  -DETH_INT=10  -DETH_RST=9

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP          @ ^3.3.2
    fastled/FastLED               @ ^3.7

extra_scripts = pre:link_rust.py
