[build]
target = "riscv32imafc-esp-espidf"

[target.riscv32imafc-esp-espidf]
linker = "riscv32-esp-elf-gcc"
rustflags = [
    "--cfg", "espidf_time64",
]

[target.xtensa-esp32s3-espidf]
linker = "xtensa-esp32s3-elf-gcc"
rustflags = [
    "--cfg", "espidf_time64",
]

[unstable]
build-std = ["std", "panic_abort"]
